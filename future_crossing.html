<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>未来へ渡る</title>
<style>
  html,body{margin:0;height:100%;background:#17140f}
  body{display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{display:block;width:min(100vw,calc(100vh*16/9));height:auto;aspect-ratio:16/9}
</style>
</head>
<body>
<canvas id="art" aria-label="果てしない海の上を、単線の細い橋がまっすぐ水平線へ続いている。その上をE231系の15両編成が静かに走っていく。行き先の空には、朝日を受けた巻積雲が天いっぱいに広がり、水平線には見たことのない岸辺の蜃気楼と、雲の大陸が浮かんでいる。"></canvas>
<script>
'use strict';
/*
  「未来へ渡る」
  画材：中目の生成りトーン紙 / ソフトパステル / 色鉛筆 / 鉛筆（HB〜4B）/ 木炭
        ＋オリジナル画材「朝凪チョーク」（ごく淡い金色の硬いチョーク。日の当たる縁と水面のきらめきにだけ使う）
  参考：reference_e231/notes.md（車両の形・帯・窓とドアの並び・パンタグラフ・連結部）
  写真は一枚も読み込まない。すべての線をストロークとして引き、紙の目でかすれさせる。
  発光・加算合成・shadowBlur・フローフィールドは使わない。
*/
(() => {
const W = 2560, H = 1440;
// ---------------------------------------------------------------- 乱数とノイズ
let seed = 20261114;
function rnd(){ seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const R = (a, b) => a + (b - a) * rnd();
const gauss = () => { let u = 0; for (let i = 0; i < 4; i++) u += rnd(); return (u - 2) / 0.577; };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const PERM = new Float32Array(2048); for (let i = 0; i < 2048; i++) PERM[i] = rnd();
function vn1(x){ const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(PERM[i & 2047], PERM[(i + 1) & 2047], u); }
function h2(i, j){ let h = (i * 374761393 + j * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vn2(x, y){ const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  return lerp(lerp(h2(i, j), h2(i + 1, j), u), lerp(h2(i, j + 1), h2(i + 1, j + 1), u), v); }
function fbm(x, y, o = 4){ let s = 0, a = .5, f = 1, n = 0; for (let k = 0; k < o; k++){ s += a * vn2(x * f + k * 17.3, y * f - k * 9.1); n += a; a *= .5; f *= 2.03; } return s / n; }

// ---------------------------------------------------------------- 色
const hx = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const jit = (c, j = 7) => [c[0] + R(-j, j), c[1] + R(-j, j), c[2] + R(-j, j)];

// ---------------------------------------------------------------- キャンバス
const cv = document.getElementById('art'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
ctx.fillStyle = '#e6dcc6'; ctx.fillRect(0, 0, W, H);

// ---------------------------------------------------------------- 紙の目
let TOOTH = null; const MASK = {};
function buildPaper(){
  const c = mk(), g = c.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0, 0, W, H);
  const octs = [[W / 170, 1], [W / 40, .22], [W / 9, .18], [W / 3.2, .35], [W / 1.7, .55], [W / 1.15, .45]];
  for (const [res, a] of octs){
    const w = Math.ceil(res), h = Math.ceil(res * H / W), s = mk(w, h), sg = s.getContext('2d'), id = sg.createImageData(w, h);
    for (let i = 0; i < w * h; i++){ const v = rnd() * 255; id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 255; }
    sg.putImageData(id, 0, 0); g.globalAlpha = a; g.imageSmoothingEnabled = true; g.drawImage(s, 0, 0, W, H);
  }
  g.globalAlpha = 1;
  for (let i = 0; i < 14000; i++){   // 繊維
    const x = R(0, W), y = R(0, H), a = R(0, 6.283), l = R(5, 38);
    g.strokeStyle = rnd() < .5 ? 'rgba(255,255,255,.11)' : 'rgba(0,0,0,.09)'; g.lineWidth = R(.5, 1.4);
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l * .5 + R(-5, 5), y + Math.sin(a) * l * .5 + R(-5, 5), x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  const d = g.getImageData(0, 0, W, H).data, n = W * H;
  const hist = new Uint32Array(256); for (let i = 0; i < n; i++) hist[d[i * 4]]++;
  let acc = 0, lo = 0, hi = 255; for (let v = 0; v < 256; v++){ acc += hist[v]; if (acc < n * .01) lo = v; if (acc < n * .99) hi = v; }
  TOOTH = new Float32Array(n); for (let i = 0; i < n; i++) TOOTH[i] = clamp((d[i * 4] - lo) / (hi - lo + 1), 0, 1);
  // 紙そのもの
  const pid = ctx.createImageData(W, H), p = pid.data, base = [234, 224, 203];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
    const i = y * W + x, t = TOOTH[i], k = 0.86 + 0.2 * t + (vn2(x / 400, y / 400) - .5) * .06;
    p[i * 4] = base[0] * k; p[i * 4 + 1] = base[1] * k; p[i * 4 + 2] = base[2] * k * .98; p[i * 4 + 3] = 255;
  }
  ctx.putImageData(pid, 0, 0);
}
function makeMask(fn){
  const c = mk(), g = c.getContext('2d'), id = g.createImageData(W, H), a = id.data;
  for (let i = 0; i < W * H; i++) a[i * 4 + 3] = 255 * fn(TOOTH[i]);
  g.putImageData(id, 0, 0); return c;
}

// ---------------------------------------------------------------- 描画パス
const LAY = mk(), lg = LAY.getContext('2d');
function pass(fn, { mask = 'med', op = 'source-over', alpha = 1, clip = null } = {}){
  lg.setTransform(1, 0, 0, 1, 0, 0); lg.globalCompositeOperation = 'source-over'; lg.globalAlpha = 1; lg.filter = 'none';
  lg.clearRect(0, 0, W, H);
  lg.save(); fn(lg); lg.restore();
  if (mask){ lg.save(); lg.globalCompositeOperation = 'destination-in'; lg.drawImage(MASK[mask], 0, 0); lg.restore(); }
  ctx.save(); if (clip){ clip(ctx); ctx.clip(); }
  ctx.globalCompositeOperation = op; ctx.globalAlpha = alpha; ctx.drawImage(LAY, 0, 0); ctx.restore();
}
const SM = mk(), smg = SM.getContext('2d');
function smear(clipFn, dx, dy, reps, al, blur = 0){   // 指でこする
  smg.clearRect(0, 0, W, H); smg.drawImage(cv, 0, 0);
  ctx.save(); ctx.beginPath(); clipFn(ctx); ctx.clip();
  if (blur) ctx.filter = `blur(${blur}px)`;
  for (let i = 1; i <= reps; i++){ ctx.globalAlpha = al; ctx.drawImage(SM, dx * i, dy * i); }
  ctx.restore();
}
function fingers(g, n, x0, y0, x1, y1, ang = 0, rx = [50, 190], ry = [8, 26]){
  for (let i = 0; i < n; i++){ const x = R(x0, x1), y = R(y0, y1); g.moveTo(x + 300, y); g.ellipse(x, y, R(rx[0], rx[1]), R(ry[0], ry[1]), ang + R(-.08, .08), 0, 6.283); }
}

// ---------------------------------------------------------------- 画材の基本ストローク
function pathPts(x, y, ang, len, curv, n){ const p = []; let a = ang; const st = len / n; for (let i = 0; i <= n; i++){ p.push([x, y]); a += curv + R(-.025, .025); x += Math.cos(a) * st; y += Math.sin(a) * st; } return p; }
function arcPts(cx, cy, rr, a0, span, n, sq = 1){ const p = []; for (let i = 0; i <= n; i++){ const a = a0 + span * i / n, k = R(.975, 1.025); p.push([cx + Math.cos(a) * rr * k, cy + Math.sin(a) * rr * sq * k]); } return p; }

// パステル（棒の側面）：束になった細い筋の集まり。筋ごとに筆圧が違う
function pastel(g, pts, w, col, al = .8, { strands = 0, taper = .3, lw = [1.2, 3.2] } = {}){
  const n = strands || Math.max(3, Math.round(w / 2.2)), N = pts.length;
  g.lineCap = 'round'; g.lineJoin = 'round';
  for (let s = 0; s < n; s++){
    const off = (n === 1 ? 0 : (s / (n - 1) - .5)) * w + R(-1, 1);
    const st = Math.floor(R(0, taper) * N * .5), en = N - 1 - Math.floor(R(0, taper) * N * .5);
    if (en <= st) continue;
    g.strokeStyle = css(jit(col, 6), al * R(.3, 1)); g.lineWidth = R(lw[0], lw[1]);
    g.beginPath();
    for (let i = st; i <= en; i++){
      const p = pts[i], q = pts[Math.min(i + 1, N - 1)], pp = pts[Math.max(i - 1, 0)];
      const dx = q[0] - pp[0], dy = q[1] - pp[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
      const pr = .72 + .28 * Math.sin(Math.PI * i / (N - 1 || 1)), o = off * pr;
      const X = p[0] + nx * o, Y = p[1] + ny * o; i === st ? g.moveTo(X, Y) : g.lineTo(X, Y);
    }
    g.stroke();
  }
}
// 鉛筆／色鉛筆：一度引いて、真ん中をもう一度なぞる（筆圧の重なり）
// 手の揺れ：位置で決まるなめらかなゆらぎ（同じ場所を通る線は同じように揺れる）
const handW = (x, y) => [(vn2(x / 55 + 3.1, y / 55) - .5) * 3.2 + (vn2(x / 9, y / 9 + 7) - .5) * .7, (vn2(x / 55, y / 55 + 5.3) - .5) * 3.2 + (vn2(x / 9 + 2, y / 9) - .5) * .7];
function densify(pts, step = 7){ const out = [];
  for (let i = 0; i < pts.length - 1; i++){ const p = pts[i], q = pts[i + 1], L = Math.hypot(q[0] - p[0], q[1] - p[1]), n = Math.max(1, Math.min(60, Math.ceil(L / step)));
    for (let k = 0; k < n; k++){ const t = k / n; out.push([p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]); } }
  out.push(pts[pts.length - 1]); return out; }
function pencilPath(g, pts, col, al, w){
  if (pts.length < 2) return;
  g.lineCap = 'round'; g.lineJoin = 'round';
  const P = densify(pts).map(p => { const h = handW(p[0], p[1]); return [p[0] + h[0], p[1] + h[1]]; });
  const n = P.length - 1;
  const draw = (a, b, alpha, lw, dx, dy) => { g.strokeStyle = css(col, alpha); g.lineWidth = lw; g.beginPath();
    for (let i = a; i <= b; i++){ const p = P[i], X = p[0] + dx + R(-.35, .35), Y = p[1] + dy + R(-.35, .35); i === a ? g.moveTo(X, Y) : g.lineTo(X, Y); } g.stroke(); };
  // 1本目：全体をなぞる。端は少しはみ出す
  const ex = (i, j, k) => { const a = P[i], b = P[j]; return [a[0] + (a[0] - b[0]) * k, a[1] + (a[1] - b[1]) * k]; };
  if (n >= 1 && rnd() < .5){ P.unshift(ex(0, 1, R(.1, .6))); } 
  const m = P.length - 1;
  draw(0, m, al * .55, w * .8, 0, 0);
  // 2本目：途中から途中まで、すこしずれて重なる（筆圧の溜まり）
  if (m >= 2){ const a = Math.floor(m * R(0, .35)), b = Math.max(a + 1, Math.ceil(m * R(.5, 1))); draw(a, Math.min(b, m), al * .6, w, R(-.6, .6), R(-.6, .6)); }
  // ときどき3本目：迷った線
  if (m >= 4 && w > 1 && rnd() < .25){ const a = Math.floor(m * R(.1, .5)), b = Math.min(m, a + Math.ceil(m * R(.15, .4))); draw(a, b, al * .3, w * .7, R(-1.4, 1.4), R(-1.4, 1.4)); }
}
function pencil(g, x1, y1, x2, y2, col, al, w){
  const L = Math.hypot(x2 - x1, y2 - y1) || 1, n = Math.max(2, Math.round(L / 14)), bend = R(-1, 1) * Math.min(L * .025, 4);
  const nx = -(y2 - y1) / L, ny = (x2 - x1) / L, p = [];
  for (let i = 0; i <= n; i++){ const t = i / n, b = Math.sin(Math.PI * t) * bend; p.push([x1 + (x2 - x1) * t + nx * b, y1 + (y2 - y1) * t + ny * b]); }
  pencilPath(g, p, col, al, w);
}
function hatch(g, x0, y0, x1, y1, ang, sp, col, al, w, seg = [25, 80], prob = .85){
  const ca = Math.cos(ang), sa = Math.sin(ang), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, Rr = Math.hypot(x1 - x0, y1 - y0) / 2;
  for (let o = -Rr; o <= Rr; o += sp * R(.6, 1.4)){
    let t = -Rr + R(0, seg[1]);
    while (t < Rr){ const l = R(seg[0], seg[1]), px = cx - sa * o + ca * t, py = cy + ca * o + sa * t;
      if (rnd() < prob) pencil(g, px, py, px + ca * l, py + sa * l, jit(col, 6), al * R(.55, 1), w * R(.8, 1.2));
      t += l + R(3, 30); }
  }
}
function smoothPath(pts, closed = true){
  const p = new Path2D(), n = pts.length, m = i => { const a = pts[(i + n) % n], b = pts[(i + 1) % n]; return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; };
  const s = m(0); p.moveTo(s[0], s[1]);
  for (let i = 1; i <= n; i++){ const c = pts[i % n], e = m(i); p.quadraticCurveTo(c[0], c[1], e[0], e[1]); }
  if (closed) p.closePath(); return p;
}
function clipMinus(g, path, dx, dy){ g.clip(minus(path, dx, dy), 'evenodd'); }
function minus(path, dx, dy){ const p = new Path2D(); p.rect(-50, -50, W + 100, H + 100); p.addPath(path, new DOMMatrix().translate(dx, dy)); return p; }
const pick = a => a[Math.floor(rnd() * a.length)];
// ================================================================ 空の絵の具（離散的なパステル棒）
const SKY = [
  ['#1b2a2d', 0.00], ['#22363a', 0.08], ['#33454a', 0.17], ['#4e4c4c', 0.26], ['#6e5551', 0.35],
  ['#93604f', 0.44], ['#b86e4b', 0.53], ['#d48751', 0.62], ['#e3a062', 0.70], ['#ecb87a', 0.78],
  ['#f2cd96', 0.85], ['#f5dcae', 0.91], ['#f8e8c8', 0.96], ['#fbf1dc', 1.01]
].map(([h, t]) => [hx(h), t]);
function stickF(t){ if (t <= SKY[0][1]) return 0; for (let i = 0; i < SKY.length - 1; i++) if (t <= SKY[i + 1][1]) return i + (t - SKY[i][1]) / (SKY[i + 1][1] - SKY[i][1]); return SKY.length - 1; }
function stick(t, j = .5){ return SKY[clamp(Math.round(stickF(t) + gauss() * j), 0, SKY.length - 1)][0]; }
function stickC(t){ const f = stickF(t), i = Math.floor(f), k = f - i; return mixc(SKY[i][0], SKY[Math.min(i + 1, SKY.length - 1)][0], k); }

// ================================================================ 3D：カメラと線路
const CAM = { ch: 27.9653, yaw: 0.391050, pitch: 0.0857801, f: 1499.93 };
const RAILH = 11;                       // 海面からレール面までの高さ (m)
const cyw = Math.cos(CAM.yaw), syw = Math.sin(CAM.yaw), cpt = Math.cos(CAM.pitch), spt = Math.sin(CAM.pitch);
function P3(x, y, z){ const yy = y - CAM.ch, X = x * cyw - z * syw, Z = x * syw + z * cyw, Y = yy * cpt + Z * spt, Z2 = -yy * spt + Z * cpt; return [W / 2 + CAM.f * X / Z2, H / 2 - CAM.f * Y / Z2, Z2]; }
const PM = (x, y, z) => P3(x, -2 * RAILH - y, z);   // 海面に映った位置
const HOR = H / 2 - CAM.f * Math.tan(CAM.pitch);    // 水平線
const TK = { x0: -17.3705, z0: 93.1730, phi: 0.704805, k1: 0.00361826, s1: 270.144, k2: -0.00312827, s2: 782.850 };
const S0 = 400, SMAX = 42000, TS = new Array(S0 + SMAX + 2);
(() => { let x = TK.x0, z = TK.z0, phi = TK.phi;
  for (let s = 0; s <= SMAX; s++){ TS[s + S0] = { x, z, phi }; const k = s < TK.s1 ? TK.k1 : s < TK.s2 ? TK.k2 : 0; phi += k; x += Math.sin(phi); z += Math.cos(phi); }
  x = TK.x0; z = TK.z0; for (let s = -1; s >= -S0; s--){ x -= Math.sin(TK.phi); z -= Math.cos(TK.phi); TS[s + S0] = { x, z, phi: TK.phi }; } })();
function trk(s){ const i = Math.floor(s), f = s - i, a = TS[clamp(i + S0, 0, S0 + SMAX)], b = TS[clamp(i + 1 + S0, 0, S0 + SMAX)]; return { x: lerp(a.x, b.x, f), z: lerp(a.z, b.z, f), phi: lerp(a.phi, b.phi, f) }; }
// 線路上の点：s=距離、off=横（＋は右側）、y=高さ
function TP(s, off, y, mir){ const t = trk(s), nx = Math.cos(t.phi), nz = -Math.sin(t.phi); return (mir ? PM : P3)(t.x + nx * off, y, t.z + nz * off); }
function camSide(s){ const t = trk(s); return (-t.x * Math.cos(t.phi) + t.z * Math.sin(t.phi)) > 0 ? 1 : -1; }   // カメラ側の向き
const depthAt = s => TP(s, 0, 0)[2];
// 太陽：線路の行き先のすこし右、水平線のすぐ上
const SUN_AZ = TS[S0 + SMAX].phi + 0.075, SUN_EL = 0.012;
const SUNV = [Math.sin(SUN_AZ) * Math.cos(SUN_EL), Math.sin(SUN_EL), Math.cos(SUN_AZ) * Math.cos(SUN_EL)];
const SUNP = P3(SUNV[0] * 1e7, CAM.ch + SUNV[1] * 1e7, SUNV[2] * 1e7);
const VAN = TP(SMAX, 0, 0);
function skyT(x, y){
  const dx = (x - SUNP[0]) / (1.55 * W), dy = (y - (HOR + 40)) / (0.95 * H);
  let t = 1 - Math.pow(Math.sqrt(dx * dx + dy * dy) * 1.18, 1.15);
  t += (fbm(x / 1100, y / 140, 3) - .5) * .1;
  return clamp(t, 0, 1);
}

// ================================================================ 仕事の列
const tasks = []; const T = f => tasks.push(f);
T(buildPaper);
let PAPERC = null;
T(() => { PAPERC = mk(); PAPERC.getContext('2d').drawImage(cv, 0, 0); });
T(() => {
  MASK.full = makeMask(t => .86 + .14 * smooth(.1, .6, t));
  MASK.heavy = makeMask(t => .12 + .88 * smooth(.02, .40, t));
  MASK.med = makeMask(t => smooth(.22, .62, t));
  MASK.light = makeMask(t => smooth(.48, .86, t));
});

// ---------------------------------------------------------------- 1. 空（パステルを寝かせて横に）
T(() => pass(g => {
  for (let y = -40; y < HOR + 30; y += 9){
    let x = -R(0, 220);
    while (x < W + 60){ const len = R(150, 440), w = R(24, 52), t = skyT(x + len / 2, y);
      pastel(g, pathPts(x, y + R(-6, 6), R(-.03, .025), len, R(-.002, .002), 7), w, stick(t, .3), .92); x += len * R(.42, .78); }
  }
}, { mask: 'full' }));
T(() => smear(g => fingers(g, 260, -100, -20, W + 100, HOR + 10, 0), 5, 0, 4, .3, 2));
T(() => pass(g => {
  for (let i = 0; i < 2400; i++){ const x = R(-100, W + 50), y = R(-20, HOR + 6), len = R(60, 240), t = skyT(x + len / 2, y);
    let c = stick(t, .7);
    if (t > .62 && t < .86 && rnd() < .16) c = hx(pick(['#c9cba4', '#bfc6a0', '#d8d2a6']));   // 夜明けの空にだけ出る淡い緑
    pastel(g, pathPts(x, y, R(-.05, .04), len, R(-.004, .004), 6), R(10, 32), c, .72); }
}, { mask: 'med' }));
T(() => smear(g => fingers(g, 160, -100, HOR * .3, W + 100, HOR + 6, 0, [80, 260], [6, 18]), -6, 0, 3, .26, 3));

// ---------------------------------------------------------------- 雲の描き方（セル塗りの塊）
function lobeShape(cx, cy, r, flat, sq = 1){
  const n = 60, ph = R(0, 50), k = Math.floor(R(5, 9)), pts = [];
  for (let i = 0; i < n; i++){ const a = i / n * 6.283;
    const rr = r * (.84 + .3 * fbm(Math.cos(a) * 1.7 + ph, Math.sin(a) * 1.7 + ph, 3) + .07 * Math.abs(Math.sin(a * k * .5 + ph)));

  for (let i = 0; i < 34; i++){
    const cx = VX + R(-.6, .6) * VRX, cy = VY - R(.05, .75) * VRU, r = R(30, 160), a0 = R(0, 6.283);
    if (inVoid(cx, cy) > .6) continue;
    pencilPath(g, arcPts(cx, cy, r, a0, R(.8, 2.6), 14, R(.25, .9)), gr, R(.25, .5), R(.9, 1.6));
  }
}, { mask: 'med' }));
T(() => pass(g => {   // 消した跡：紙の色のパステルでこすって、線を半分だけ消す
  for (let i = 0; i < 18; i++){ const x = VX + R(-.6, .6) * VRX, y = VY - R(-.2, .7) * VRU; if (inVoid(x, y) > .6) continue;
    pastel(g, pathPts(x, y, R(-.6, .6), R(40, 120), R(-.02, .02), 5), R(14, 30), hx('#ece3cf'), .55, { taper: .5 }); }
}, { mask: 'heavy' }));
// まだ選ばれていない色：紙の端で試すように置いた、いくつかの短い筆致
T(() => pass(g => {
  const tries = ['#a9c3a6', '#e8c96a', '#d98d8d', '#7fa9a2', '#f0b07a', '#b9c98f'];
  for (let i = 0; i < tries.length; i++){
    const a = -Math.PI * (.15 + .7 * i / (tries.length - 1)) + R(-.1, .1), rr = R(.35, .6);
    const x = VX + Math.cos(a) * VRX * rr, y = VY + Math.sin(a) * VRU * rr;
    for (let k = 0; k < 2; k++) pastel(g, pathPts(x + R(-4, 4), y + k * 7, R(-.25, .25), R(30, 70), R(-.02, .02), 4), R(7, 12), hx(tries[i]), R(.75, .95), { taper: .4 });
  }
}, { mask: 'med' }));

// ================================================================ 9. 仕上げ
// 四隅：鉛筆を寝かせた斜めのハッチングでやわらかく締める
T(() => pass(g => {
  for (let i = 0; i < 1800; i++){
    const cx = rnd() < .5 ? 0 : W, cy = H, dd = Math.pow(rnd(), 1.6) * .32;
    const a = R(0, Math.PI / 2), x = Math.abs(cx - Math.cos(a) * dd * W), y = Math.abs(cy - Math.sin(a) * dd * H * 1.4), l = R(40, 140) * (1 - dd);
    pencil(g, x, y, x + l * .75, y - l * .66, hx(pick(['#1e1b18', '#2a2420', '#22302f'])), R(.05, .18) * (1 - dd * 2), R(1.5, 3.2));
  }
}, { mask: 'med', op: 'multiply' }));
// 平らな塗りを、色鉛筆とパステルの筆致で覆う（車体・屋根・桁）
function bbOf(pts){ const b = pts.reduce((m, p) => [Math.min(m[0], p[0]), Math.min(m[1], p[1]), Math.max(m[2], p[0]), Math.max(m[3], p[1])], [1e9, 1e9, -1e9, -1e9]); return [Math.max(b[0], -10), Math.max(b[1], -10), Math.min(b[2], W + 10), Math.min(b[3], H + 10)]; }
T(() => pass(g => {
  for (let c = 1; c <= 15; c++){
    const car = CARS[c], G = carGeom(car), d = G.depth; if (d > 700) continue;
    const us = []; for (let i = 0; i <= 20; i++) us.push(i);
    const side = us.map(u => G.at(u, HW, prof(car, u).eave - .3)).concat(us.slice().reverse().map(u => G.at(u, HW, Math.max(1.2, prof(car, u).bot))));
    const roof = us.map(u => G.at(u, HW, prof(car, u).eave)).concat(us.slice().reverse().map(u => G.at(u, -HW, prof(car, u).eave)));
    const sp = Math.max(1.6, lwAt(d, .09)), lw = Math.max(.6, lwAt(d, .03));
    g.save(); g.clip(polyPath(side)); let bb = bbOf(side);
    hatch(g, bb[0] - 4, bb[1] - 4, bb[2] + 4, bb[3] + 4, R(-1.25, -1.0), sp, hx('#6e665e'), .26, lw, [6, 26], .75);
    hatch(g, bb[0] - 4, bb[1] - 4, bb[2] + 4, bb[3] + 4, R(.25, .45), sp * 1.6, hx('#efe2cc'), .22, lw, [6, 22], .6);
    g.restore();
    g.save(); g.clip(polyPath(roof)); bb = bbOf(roof);
    const a0 = G.at(0, 0, 3.6), a1 = G.at(20, 0, 3.6), ang = Math.atan2(a1[1] - a0[1], a1[0] - a0[0]);
    hatch(g, bb[0] - 4, bb[1] - 4, bb[2] + 4, bb[3] + 4, ang + R(-.08, .08), sp * .9, hx('#5d5650'), .2, lw, [10, 50], .8);
    g.restore();
  }
  // 桁の側面：斜めのハッチングを重ねる
  for (let s0 = -380; s0 < 2500; ){
    const d = depthAt(Math.max(s0, -380)), ds = clamp(d / 25, 3, 60), sg = camSide(s0);
    if (d > 1500 || d < 20){ s0 += ds; continue; }
    const quad = [TP(s0, sg * DECK_HW, -.2), TP(s0 + ds, sg * DECK_HW, -.2), TP(s0 + ds, sg * DECK_HW, GIRD_B), TP(s0, sg * DECK_HW, GIRD_B)];
    g.save(); g.clip(polyPath(quad)); const bb = bbOf(quad);
    if (bb[2] > bb[0] && bb[3] > bb[1]) hatch(g, bb[0] - 4, bb[1] - 4, bb[2] + 4, bb[3] + 4, R(-1.15, -.95), Math.max(3, lwAt(d, .18)), hx('#3a302d'), .22, Math.max(.6, lwAt(d, .04)), [8, 34], .8);
    g.restore(); s0 += ds;
  }
}, { mask: 'med' }));
// 車体の色の境目を、パステルを指でこすったようにやわらかくにじませる
function carRegion(g, near){
  for (let c = 1; c <= 15; c++){ const car = CARS[c], G = carGeom(car); if (G.depth > (near ? 400 : 1e9)) continue;
    const us = []; for (let i = 0; i <= 20; i++) us.push(i);
    const pts = us.map(u => G.at(u, HW, Math.max(1.1, prof(car, u).bot))).concat(us.slice().reverse().map(u => G.at(u, -HW, prof(car, u).crest + .05)));
    pts.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); g.closePath(); }
}
// 車体の向き（画面上）に沿って、前後に少しずつこする
T(() => { const G = carGeom(CARS[13]), a = G.at(0, HW, 2), b = G.at(20, HW, 2), L = Math.hypot(b[0] - a[0], b[1] - a[1]), ux = (b[0] - a[0]) / L, uy = (b[1] - a[1]) / L;
  smear(g => carRegion(g, true), ux * 1.0, uy * 1.0, 1, .2, 0);
  smear(g => carRegion(g, true), -uy * .7, ux * .7, 1, .14, 0); });
// 帯と銀の境目、窓の縁に、まじった色の短い筆致を重ねる（境目が一本の線にならないように）
T(() => pass(g => {
  for (let c = 1; c <= 15; c++){
    const car = CARS[c], G = carGeom(car), d = G.depth; if (d > 600) continue;
    const x0 = G.at(10, 0, 2)[0], C = h => fogc(hx(h), d, x0), F = carFeatures(car);
    const lw = Math.max(1, lwAt(d, .05)), wd = Math.max(1.4, lwAt(d, .07));
    const edge = (a, b, v, col, al) => { const n = Math.max(2, Math.round((b - a) / 1.2));
      for (let k = 0; k < n; k++){ const u0 = lerp(a, b, k / n) + R(-.2, .2), u1 = u0 + R(.6, 1.6); if (u1 > b + .2) continue;
        const p1 = G.at(u0, HW, v + R(-.03, .03)), p2 = G.at(u1, HW, v + R(-.03, .03));
        pastel(g, [p1, p2], wd * R(.7, 1.3), C(col), al * R(.6, 1), { strands: 2, taper: .5, lw: [lw * .6, lw * 1.2] }); } };
    for (const [a, b] of F.bands){
      edge(a, b, 1.57, '#7f8d78', .5);     // 緑と銀の下の境目：にごった中間色
      edge(a, b, 1.80, '#a98a3f', .55);    // 緑とオレンジの境目
      edge(a, b, 1.91, '#d4a77e', .5);     // オレンジと銀の境目
    }
    for (const tb of F.topBand){ edge(tb[0], tb[1], tb[2], '#8fa088', .45); edge(tb[0], tb[1], tb[3], '#8fa088', .45); }
    // 窓とドアの縁：銀と内側の色のあいだを、色鉛筆でにじませる
    for (const w of F.wins.concat(F.deckWins || [])){ const [a, b, v0, v1] = w;
      for (const v of [v0, v1]){ const p1 = G.at(a + .05, HW, v), p2 = G.at(b - .05, HW, v); pencil(g, p1[0], p1[1], p2[0], p2[1], C('#9a8574'), .35, lw); } }
    for (const dr of F.doors){ const [a, b] = dr; for (const u of [a, b]){ const p1 = G.at(u, HW, 1.1), p2 = G.at(u, HW, 2.95); pencil(g, p1[0], p1[1], p2[0], p2[1], C('#c9bfb2'), .3, lw * 1.4); } }
  }
}, { mask: 'light' }));
// 橋の長い縁を、手で何度もなぞった線で描き直す（定規を使わない）
T(() => pass(g => {
  const edges = [[-1, -.2, '#2a2423', .6], [1, -.2, '#2a2423', .6], [0, 'bot', '#221c1b', .75], [0, 'far', '#f3d09c', .55]];
  for (const [side, yy, col, al] of edges){
    let seg = [], segLen = R(60, 260), acc = 0, prev = null;
    for (let s0 = -380; s0 < 9000; s0 += Math.max(1, depthAt(Math.max(s0, -380)) / 90)){
      const sg = camSide(s0), o = side === 0 ? (yy === 'far' ? -sg * DECK_HW : sg * DECK_HW) : side * DECK_HW, y = yy === 'bot' ? GIRD_B : yy === 'far' ? .45 : yy;
      const p = TP(s0, o, y); if (p[2] < 8) continue;
      if (prev){ acc += Math.hypot(p[0] - prev[0], p[1] - prev[1]); }
      seg.push([p[0], p[1]]); prev = p;
      if (acc > segLen){ const lw = Math.max(.7, lwAt(p[2], .09)); pencilPath(g, seg, fogc(hx(col), p[2], p[0]), al, lw); seg = [seg[seg.length - 1]]; acc = 0; segLen = R(60, 260); }
    }
    if (seg.length > 1) pencilPath(g, seg, hx(col), al, 1);
  }
}, { mask: 'med' }));
// 全体に、紙が手のなかでわずかに波打つようなゆがみ：完全な直線をどこにも残さない
T(() => {
  const src = ctx.getImageData(0, 0, W, H), dst = ctx.createImageData(W, H), a = src.data, b = dst.data;
  const gw = Math.ceil(W / 16) + 2, gh = Math.ceil(H / 16) + 2, DX = new Float32Array(gw * gh), DY = new Float32Array(gw * gh);
  for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++){ const x = i * 16, y = j * 16;
    DX[j * gw + i] = (vn2(x / 170, y / 170) - .5) * 5 + (vn2(x / 40 + 9, y / 40) - .5) * 1.8;
    DY[j * gw + i] = (vn2(x / 170 + 4, y / 170 + 2) - .5) * 5 + (vn2(x / 40, y / 40 + 9) - .5) * 1.8; }
  for (let y = 0; y < H; y++){ const gy = y / 16, j = gy | 0, fy = gy - j;
    for (let x = 0; x < W; x++){ const gx = x / 16, i = gx | 0, fx = gx - i, k = j * gw + i;
      const dx = (DX[k] * (1 - fx) + DX[k + 1] * fx) * (1 - fy) + (DX[k + gw] * (1 - fx) + DX[k + gw + 1] * fx) * fy;
      const dy = (DY[k] * (1 - fx) + DY[k + 1] * fx) * (1 - fy) + (DY[k + gw] * (1 - fx) + DY[k + gw + 1] * fx) * fy;
      const sx = clamp(Math.round(x + dx), 0, W - 1), sy = clamp(Math.round(y + dy), 0, H - 1), si = (sy * W + sx) * 4, di = (y * W + x) * 4;
      b[di] = a[si]; b[di + 1] = a[si + 1]; b[di + 2] = a[si + 2]; b[di + 3] = 255; } }
  ctx.putImageData(dst, 0, 0);
});
// フィルムのような細かな粒子
T(() => {
  const gw = W / 2 | 0, gh = H / 2 | 0, c = mk(gw, gh), g = c.getContext('2d'), id = g.createImageData(gw, gh);
  for (let i = 0; i < gw * gh; i++){ const v = 128 + gauss() * 32; id.data[i * 4] = v; id.data[i * 4 + 1] = v * .99; id.data[i * 4 + 2] = v * .96; id.data[i * 4 + 3] = 255; }
  g.putImageData(id, 0, 0);
  ctx.save(); ctx.globalCompositeOperation = 'soft-light'; ctx.globalAlpha = .24; ctx.imageSmoothingEnabled = false; ctx.drawImage(c, 0, 0, W, H); ctx.restore();
});
T(() => { cv.dataset.done = '1'; });
function run(){
  const t0 = performance.now();
  while (tasks.length && performance.now() - t0 < 24) tasks.shift()();
  if (tasks.length) requestAnimationFrame(run);
}
requestAnimationFrame(run);
})();
